[package]
name = "freedesktop-icon-assets"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Resolve Freedesktop SVG icons on the build host into Manganis assets"

[lib]
proc-macro = true

[dependencies]
freedesktop-icons = { package = "cosmic-freedesktop-icons", git = "https://github.com/pop-os/freedesktop-icons" }
proc-macro2 = "1"
quote = "1"
sha2 = "0.10"
syn = "2"

[dev-dependencies]
tempfile = "3"
